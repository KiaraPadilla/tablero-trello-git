<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/modales.css" />
  <link rel="stylesheet" href="css/tableros.css" />
  <link rel="stylesheet" href="css/usuarios.css">
  <link rel="stylesheet" href="css/tarjetas.css" />
  <link rel="stylesheet" href="css/notificaciones.css" />
</head>
<body>
  <header class="app-header">
    <h1>Tablero de Tareas</h1>
    <div id="usuario-actual"></div>
  </header>

  <main>
    <section id="landing-tableros" class="hero-seccion">
  <div class="hero-contenido">
    <h1 class="hero-titulo">Domina tu tiempo,<br>organiza tu <span>éxito</span></h1>
    <p class="hero-subtitulo">
      Una plataforma visual e intuitiva para gestionar tus proyectos. 
      Crea tableros, asigna tareas y lleva a tu equipo al siguiente nivel.
    </p>
  </div>
  
  <div class="hero-grafico">
    <div class="tarjeta-flotante tarjeta-1">
      <div class="linea-corta"></div>
      <div class="linea-larga"></div>
    </div>
    <div class="tarjeta-flotante tarjeta-2">
      <div class="linea-corta"></div>
      <div class="linea-larga"></div>
    </div>
    <div class="tarjeta-flotante tarjeta-3">
      <div class="linea-corta"></div>
      <div class="linea-larga"></div>
    </div>
  </div>
</section>

    <section id="seccion-tableros" hidden>
      <h2>Tableros</h2>
      <div id="controles-tableros">
        <input type="text" id="input-nombre-tablero" placeholder="Nombre del nuevo tablero" />
        <button id="btn-crear-tablero">Crear tablero</button>
      </div>
      <ul id="lista-tableros"></ul>
    </section>

    <section id="seccion-tablero-activo" hidden>
      <h2 id="titulo-tablero-activo"></h2>
      <div id="columnas-tablero"></div>
    </section>
  </main>

  <div id="notificaciones"></div>

  <script src="js/modales.js"></script>
  <script src="js/notificaciones.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="js/tarjetas.js"></script>
  <script src="js/tableros.js"></script>
</body>
</html>
